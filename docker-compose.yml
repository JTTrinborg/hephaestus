services:
  db:
    image: postgres:16
    container_name: heph-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hephaestus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - heph-db-data:/var/lib/postgresql/data
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: heph-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Australia/Brisbane
      TZ: Australia/Brisbane
    volumes:
      - heph-n8n-data:/home/node/.n8n

volumes:
  heph-db-data:
  heph-n8n-data:
