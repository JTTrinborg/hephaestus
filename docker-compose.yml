services:
  db:
    image: postgres:16
    container_name: heph-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hephaestus
      ports:
        - "127.0.0.1:5432:5432"
    volumes:
      - heph-db-data:/var/lib/postgresql/data

volumes:
  heph-db-data: